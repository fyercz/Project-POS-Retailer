# Pemeriksaan otomatis setiap push / pull request:
# cek tipe TypeScript, build, dan seluruh tes. Berjalan dari salinan bersih repo, sehingga
# file yang lupa di-commit (mis. tertangkap .gitignore) langsung ketahuan.
name: CI

on:
  # Semua branch, agar perubahan bisa diuji sebelum masuk main
  push:
  pull_request:

jobs:
  test:
    name: Tes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows ikut diuji karena komputer kasir memakai Windows
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Pasang PERSIS versi di package-lock.json (sama dengan yang dipakai komputer kasir)
      - run: npm ci --no-audit --no-fund
      - name: Cek tipe TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Tes
        shell: bash
        # Tes yang gagal juga ditulis sebagai anotasi (::error::) agar penyebabnya terlihat di ringkasan CI
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt || {
            grep -E "^not ok|^\s+not ok|error:|Error:|expected|actual|code: '" test-output.txt | head -40 | sed 's/^/::error::/'
            exit 1
          }

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Pasang browser Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Tes E2E
        run: npm run test:e2e
      - name: Simpan jejak tes yang gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-hasil
          path: test-results/
          retention-days: 7

  # Rilis: setelah SEMUA tes lulus di main, buat tag vX.Y.Z dari versi package.json (bila belum ada).
  # update.bat di komputer kasir memasang tag rilis tertinggi, jadi kode yang belum lolos tes
  # (atau belum dinaikkan versinya) tidak ikut terpasang di toko.
  rilis:
    name: Tag rilis
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Buat tag dari versi package.json
        run: |
          V="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "Tag $V sudah ada, tidak membuat rilis baru."
            exit 0
          fi
          git tag "$V"
          git push origin "$V"
          echo "Rilis $V dibuat."
