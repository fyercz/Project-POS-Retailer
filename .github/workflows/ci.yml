# Pemeriksaan otomatis setiap push / pull request:
# cek tipe TypeScript, build, dan seluruh tes. Berjalan dari salinan bersih repo, sehingga
# file yang lupa di-commit (mis. tertangkap .gitignore) langsung ketahuan.
name: CI

on:
  # Semua branch, agar perubahan bisa diuji sebelum masuk main
  push:
  pull_request:

jobs:
  test:
    name: Tes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows ikut diuji karena komputer kasir memakai Windows
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Repo tidak menyimpan package-lock.json, jadi memakai npm install (bukan npm ci)
      - run: npm install --no-audit --no-fund
      - name: Cek tipe TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Tes
        shell: bash
        # Tes yang gagal juga ditulis sebagai anotasi (::error::) agar penyebabnya terlihat di ringkasan CI
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt || {
            grep -E "^not ok|^\s+not ok|error:|Error:|expected|actual|code: '" test-output.txt | head -40 | sed 's/^/::error::/'
            exit 1
          }
