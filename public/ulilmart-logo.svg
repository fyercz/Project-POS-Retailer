<svg viewBox="0 0 560 226" width="560" height="226" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Steel Blue Gradient for 'ULIL' -->
    <linearGradient id="ulilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A93C6" />
      <stop offset="47%" stop-color="#2E71A3" />
      <stop offset="50%" stop-color="#1E5782" />
      <stop offset="100%" stop-color="#164366" />
    </linearGradient>

    <!-- Gloss Specular Reflection -->
    <linearGradient id="ulilGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="68%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft Drop Shadow with safety bounds -->
    <filter id="ulilDropShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#ulilDropShadow)">
    <!-- 1. BOLD GEOMETRIC LETTERS 'ULIL' -->
    <g fill="url(#ulilGrad)">
      <!-- U with angled chamfer at bottom left -->
      <path d="M 20 22 L 54 22 L 54 88 L 88 88 L 88 22 L 122 22 L 122 96 C 122 114, 108 126, 88 126 L 44 126 L 20 102 Z" />
      <!-- L -->
      <path d="M 134 22 L 168 22 L 168 92 L 214 92 L 214 126 L 134 126 Z" />
      <!-- I -->
      <path d="M 226 22 L 260 22 L 260 126 L 226 126 Z" />
      <!-- L -->
      <path d="M 272 22 L 306 22 L 306 92 L 352 92 L 352 126 L 272 126 Z" />
    </g>

    <!-- Horizontal Gloss Sheen -->
    <path d="M 20 22 L 122 22 L 122 68 C 104 60, 36 64, 20 68 Z
             M 134 22 L 168 22 L 168 68 C 150 62, 134 65, 134 68 Z
             M 226 22 L 260 22 L 260 68 C 244 62, 226 65, 226 68 Z
             M 272 22 L 306 22 L 306 68 C 290 62, 272 65, 272 68 Z"
          fill="url(#ulilGloss)" />

    <!-- 2. SCRIPT 'Mart' -->
    <g transform="translate(365, 116) rotate(-3)">
      <text x="0" y="0"
            font-family="'Dancing Script', 'Brush Script MT', 'Segoe Script', cursive, sans-serif"
            font-size="82"
            font-weight="bold"
            font-style="italic"
            fill="#276A9C"
            letter-spacing="1">Mart</text>
    </g>

    <!-- 3. TAGLINE BANNER: [Lengkap] | [& Hemat] -->
    <g transform="translate(20, 146)">
      <!-- Left Box: Solid Deep Blue with White 'Lengkap' -->
      <rect x="0" y="0" width="230" height="52" rx="4" fill="#205B85" />
      <text x="115" y="35"
            text-anchor="middle"
            font-family="'Montserrat', 'Century Gothic', -apple-system, sans-serif"
            font-size="28"
            font-weight="900"
            fill="#FFFFFF"
            letter-spacing="1.5">Lengkap</text>

      <!-- Right Box: Framed Border with '& Hemat' -->
      <rect x="230" y="0" width="260" height="52" rx="4" stroke="#205B85" stroke-width="3.5" fill="#FFFFFF" />
      <text x="360" y="35"
            text-anchor="middle"
            font-family="'Montserrat', 'Century Gothic', -apple-system, sans-serif"
            font-size="28"
            font-weight="900"
            fill="#205B85"
            letter-spacing="1.5">&amp; Hemat</text>
    </g>
  </g>
</svg>
